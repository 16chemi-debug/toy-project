<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>부모님 건강 기록 — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied verbatim from app/globals.css ── */
  :root {
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.508 0.118 165.612);
    --primary-foreground: oklch(0.979 0.021 166.113);
    --secondary: oklch(0.967 0.001 286.375);
    --secondary-foreground: oklch(0.21 0.006 285.885);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --chart-1: oklch(0.897 0.196 126.665);
    --chart-2: oklch(0.768 0.233 130.85);
    --chart-3: oklch(0.648 0.2 131.684);
    --chart-4: oklch(0.532 0.157 131.589);
    --chart-5: oklch(0.453 0.124 130.933);
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --font: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.432 0.095 166.913);
    --primary-foreground: oklch(0.979 0.021 166.113);
    --secondary: oklch(0.274 0.006 286.033);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --chart-1: oklch(0.897 0.196 126.665);
    --chart-2: oklch(0.768 0.233 130.85);
    --chart-3: oklch(0.648 0.2 131.684);
    --chart-4: oklch(0.532 0.157 131.589);
    --chart-5: oklch(0.453 0.124 130.933);
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product styles ── */
  .sh-stage { font-size: 19px; line-height: 1.5; color: var(--foreground) }

  .p-screen { display: flex; flex-direction: column; min-height: 100% }
  .p-body { flex: 1; padding-bottom: 12px }

  /* type */
  .p-date { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 1px }
  .p-sub { font-size: 17px; color: var(--muted-foreground); margin: 0 0 10px }
  .p-h2 { font-size: 21px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em }

  /* card */
  .p-card {
    background: var(--card); color: var(--card-foreground);
    border: 2px solid var(--border); border-radius: var(--radius);
    padding: 9px 13px 11px; margin-bottom: 7px;
  }

  /* metric input */
  .p-field-label {
    display: block; font-size: 38px; font-weight: 700; line-height: 1.12;
    margin-bottom: 5px; letter-spacing: -0.02em;
  }
  .p-field-hint { font-size: 22px; font-weight: 500; color: var(--muted-foreground) }
  .p-inputrow { display: flex; align-items: center; gap: 9px }
  .p-input {
    flex: 1; min-width: 0; width: 100%;
    font-family: inherit; font-size: 32px; font-weight: 700; text-align: center;
    padding: 6px; color: var(--foreground);
    background: var(--background);
    border: 2px solid var(--input); border-radius: calc(var(--radius) * 0.8);
    -moz-appearance: textfield;
  }
  .p-input::-webkit-outer-spin-button, .p-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .p-input::placeholder { color: color-mix(in oklab, var(--muted-foreground) 50%, transparent); font-weight: 600 }
  .p-input:focus { outline: 3px solid var(--primary); outline-offset: 1px; border-color: var(--primary) }
  .p-unit { font-size: 17px; font-weight: 700; color: var(--muted-foreground); white-space: nowrap; min-width: 56px }
  .p-slash { font-size: 27px; font-weight: 700; color: var(--muted-foreground) }

  .p-note {
    width: 100%; font-family: inherit; font-size: 18px; line-height: 1.45;
    padding: 10px; min-height: 76px; resize: vertical; color: var(--foreground);
    background: var(--background);
    border: 2px solid var(--input); border-radius: calc(var(--radius) * 0.8);
  }
  .p-note:focus { outline: 3px solid var(--primary); outline-offset: 1px; border-color: var(--primary) }

  .p-note-toggle {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    width: 100%; font-family: inherit; font-size: 38px; font-weight: 700;
    line-height: 1.15; letter-spacing: -0.02em;
    color: var(--foreground); background: var(--card); cursor: pointer;
    border: 2px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 9px; text-align: left;
  }
  .p-note-toggle span { font-size: 30px; font-weight: 500; color: var(--muted-foreground) }
  .p-date { margin-bottom: 8px }

  /* buttons */
  .p-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; font-family: inherit; font-size: 21px; font-weight: 800;
    padding: 16px; border-radius: var(--radius); cursor: pointer;
    border: 2px solid transparent; letter-spacing: -0.01em;
  }
  .p-btn-primary { background: var(--primary); color: var(--primary-foreground) }
  .p-btn-outline { background: var(--card); color: var(--foreground); border-color: var(--border) }
  .p-btn-ghost {
    background: none; color: var(--muted-foreground); border: none;
    font-size: 18px; font-weight: 700; padding: 10px; text-decoration: underline;
  }
  .p-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px }

  .p-sticky {
    position: sticky; bottom: -17px; z-index: 5;
    padding: 12px 0 21px; background: var(--background);
    box-shadow: 0 -14px 16px -6px var(--background);
  }

  /* saved summary */
  .p-saved-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 17px; font-weight: 800; color: var(--primary);
    background: color-mix(in oklab, var(--primary) 12%, var(--background));
    border-radius: 999px; padding: 7px 14px; margin-bottom: 11px;
  }
  .p-readrow {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .p-readrow:last-child { border-bottom: 0 }
  .p-readrow dt { font-size: 38px; font-weight: 700; margin: 0; letter-spacing: -0.02em }
  .p-readrow dd { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em }
  .p-readrow dd small { font-size: 16px; font-weight: 600; color: var(--muted-foreground); margin-left: 3px }

  /* trend panels */
  .p-panel { margin-bottom: 2px }
  .p-panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 1px;
  }
  .p-panel-name { font-size: 19px; font-weight: 800; letter-spacing: -0.01em }
  .p-panel-last { font-size: 16px; font-weight: 600; color: var(--muted-foreground) }
  .p-panel-last b { font-size: 20px; font-weight: 800; color: var(--foreground) }
  .p-chart { display: block; width: 100%; height: auto; overflow: visible }

  .p-grid-line { stroke: var(--border); stroke-width: 1 }
  .p-axis-text { font-size: 13px; font-weight: 600; fill: var(--muted-foreground); font-family: var(--font) }
  .p-band { fill: var(--chart-3); opacity: 0.18 }
  .p-normal { fill: var(--foreground); opacity: 0.07 }
  .p-target-line { stroke: var(--muted-foreground); stroke-width: 1.4; stroke-dasharray: 5 4 }
  .p-target-text { font-size: 12.5px; font-weight: 700; fill: var(--muted-foreground); font-family: var(--font) }
  .sh-theme-dark .p-normal { fill: var(--foreground); opacity: 0.1 }
  .p-daily { fill: none; stroke: var(--chart-3); stroke-width: 1.1; opacity: 0.5; stroke-linejoin: round }
  .p-trend { fill: none; stroke: var(--chart-5); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round }
  .p-bar { fill: var(--chart-4) }
  .p-marker { fill: var(--chart-5) }
  /* the project's dark chart tokens equal its light ones, so the dark surface
     needs the lighter end of the same ramp to keep the trend line readable */
  .sh-theme-dark .p-trend { stroke: var(--chart-2) }
  .sh-theme-dark .p-daily { stroke: var(--chart-3); opacity: 0.55 }
  .sh-theme-dark .p-band { fill: var(--chart-2); opacity: 0.15 }
  .sh-theme-dark .p-bar { fill: var(--chart-3) }
  .sh-theme-dark .p-marker { fill: var(--chart-2) }
  .p-axis-strip { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 2px }
  .p-axis-key {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 3px 0 0;
    font-size: 15px; font-weight: 600; color: var(--muted-foreground);
  }
  .p-axis-key span { display: inline-flex; align-items: center; gap: 6px }
  .p-axis-key svg, .p-axis-key i { flex: none }
  .p-axis-key i.band {
    width: 18px; height: 11px; border-radius: 2px;
    background: color-mix(in oklab, var(--foreground) 7%, var(--card));
    border: 1px solid var(--border);
  }
  .p-axis-key i.dash {
    width: 18px; height: 0; border-top: 2px dashed var(--muted-foreground);
  }

  .p-notelist div { padding: 9px 0; border-bottom: 1px solid var(--border) }
  .p-notelist div:last-child { border-bottom: 0 }
  .p-notelist b { display: block; font-size: 16px; font-weight: 700; color: var(--muted-foreground) }
  .p-notelist p { margin: 1px 0 0; font-size: 18px }

  /* empty state */
  .p-empty { text-align: center; padding: 48px 12px; color: var(--muted-foreground) }
  .p-empty h2 { font-size: 23px; font-weight: 800; color: var(--foreground); margin: 0 0 8px }
  .p-empty p { font-size: 18px; margin: 0 }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">

  <!-- ── 아침 입력 ── -->
  <section data-screen="today" data-title="아침 입력" data-states="기록함">
    <div class="p-screen">
      <div class="p-body">
        <h1 class="p-date" id="today-date">9월 17일 목요일</h1>
        <p class="p-sub" data-when="기록함" hidden>오늘 아침 기록을 남기셨습니다.</p>

        <!-- 입력 폼 -->
        <div data-when="Default">
          <div class="p-card" data-component="new:MetricField">
            <label class="p-field-label" for="in-sys">혈압 <span class="p-field-hint">위 / 아래</span></label>
            <div class="p-inputrow">
              <input class="p-input" data-component="Input" id="in-sys" type="number" inputmode="numeric" placeholder="140" value="138">
              <span class="p-slash" aria-hidden="true">/</span>
              <input class="p-input" data-component="Input" id="in-dia" type="number" inputmode="numeric" placeholder="90" value="86">
            </div>
          </div>

          <div class="p-card" data-component="new:MetricField">
            <label class="p-field-label" for="in-pulse">맥박</label>
            <div class="p-inputrow">
              <input class="p-input" data-component="Input" id="in-pulse" type="number" inputmode="numeric" placeholder="60" value="64">
              <span class="p-unit">회 / 분</span>
            </div>
          </div>

          <div class="p-card" data-component="new:MetricField">
            <label class="p-field-label" for="in-glucose">혈당 <span class="p-field-hint">기상 후</span></label>
            <div class="p-inputrow">
              <input class="p-input" data-component="Input" id="in-glucose" type="number" inputmode="numeric" placeholder="130" value="127">
              <span class="p-unit">mg/dL</span>
            </div>
          </div>

          <div class="p-card" data-component="new:MetricField">
            <label class="p-field-label" for="in-dose">인슐린</label>
            <div class="p-inputrow">
              <input class="p-input" data-component="Input" id="in-dose" type="number" inputmode="numeric" placeholder="14" value="14">
              <span class="p-unit">단위</span>
            </div>
          </div>

          <button class="p-note-toggle" data-component="Button" id="note-open" onclick="openNote()">
            특이사항
            <span aria-hidden="true">＋</span>
          </button>
          <div class="p-card" data-component="new:MetricField" id="note-field" hidden>
            <label class="p-field-label" for="in-note">특이사항</label>
            <textarea class="p-note" data-component="Textarea" id="in-note" placeholder="몸 상태나 남길 말"></textarea>
          </div>
        </div>

        <!-- 저장 후 -->
        <div data-when="기록함" hidden>
          <span class="p-saved-badge" data-component="Badge">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            저장했습니다
          </span>

          <div class="p-card" data-component="Card">
            <dl style="margin:0">
              <div class="p-readrow"><dt>혈압</dt><dd>138 / 86</dd></div>
              <div class="p-readrow"><dt>맥박</dt><dd>64<small>회/분</small></dd></div>
              <div class="p-readrow"><dt>혈당</dt><dd>127<small>mg/dL</small></dd></div>
              <div class="p-readrow"><dt>인슐린</dt><dd>14<small>단위</small></dd></div>
            </dl>
          </div>

          <div class="p-card" data-component="Card">
            <div class="p-panel-head">
              <span class="p-panel-name">최근 2주</span>
              <span class="p-panel-last" id="mini-range">9월 4일 – 9월 17일</span>

            <div id="mini-charts"></div>
          </div>

          <button class="p-btn p-btn-ghost" data-component="Button" onclick="prototypeShell.setState('Default')">기록 고치기</button>
        </div>
      </div>

      <div class="p-sticky">
        <button class="p-btn p-btn-primary" data-component="Button" data-when="Default" onclick="prototypeShell.setState('기록함')">저장하기</button>

          3개월 추이 보기

  </section>

  <!-- ── 3개월 추이 ── -->
  <section data-screen="trend" data-title="3개월 추이" data-states="빈 기록">
    <div class="p-screen">
      <div class="p-body">
        <h1 class="p-date">최근 3개월</h1>
        <p class="p-sub" id="trend-range" data-when="Default">6월 18일 – 9월 17일 · 92일 기록</p>

          <div class="p-card" data-component="Card">
            <div id="trend-charts"></div>
          </div>

          <div class="p-card" data-component="Card">
            <h2 class="p-h2">특이사항</h2>

          <h2>아직 기록이 없습니다</h2>
          <p>아침 기록을 남기시면<br>여기에 추이가 그려집니다.</p>

      <div class="p-sticky">
        <button class="p-btn p-btn-outline" data-component="Button" onclick="location.hash='today'">오늘 기록으로</button>
      </div>

<script>document.body.classList.add('sh-vp-390');</script>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
    if (current.dataset.screen === 'today' && active === 'Default') closeNote();
    stage.scrollTop = 0;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });
</script>

<script>
/* ── 특이사항 입력칸 여닫기 ── */
function openNote() {
  document.getElementById('note-open').hidden = true;
  document.getElementById('note-field').hidden = false;
  const scroller = document.querySelector('.sh-stage');
  scroller.scrollTop = scroller.scrollHeight;
  document.getElementById('in-note').focus({ preventScroll: true });
}
function closeNote() {
  const open = document.getElementById('note-open');
  const field = document.getElementById('note-field');
  if (!open || !field) return;
  open.hidden = false;
  field.hidden = true;
  document.getElementById('in-note').value = '';
}

/* ── dummy data: 92일치 아침 기록 (2026-06-18 ~ 2026-09-17) ── */
(function () {
  function makeRng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  const rand = makeRng(20260917);
  const wobble = (amp) => (rand() - 0.5) * 2 * amp;

  const NOTES = {
    6:  '어지러워서 한참 앉아 있었음',
    19: '감기약 먹는 중',
    34: '전날 저녁 늦게 먹음',
    48: '병원에서 약 단위를 올림',
    61: '손발이 저림',
    77: '잠을 설침',
    88: '입맛이 없어 아침을 거름'
  };

  const START = new Date(2026, 5, 18);
  const DAYS = 92;
  const days = [];
  for (let i = 0; i < DAYS; i++) {
    const t = i / (DAYS - 1);
    const date = new Date(START.getFullYear(), START.getMonth(), START.getDate() + i);
    days.push({
      i, date,
      sys: Math.round(142 - 11 * t + wobble(7)),
      dia: Math.round(89 - 6 * t + wobble(5)),
      pulse: Math.round(67 + wobble(6)),
      glucose: Math.round(159 - 30 * t + wobble(16)),
      dose: i < 48 ? 12 : 14,
      note: NOTES[i] || null
    });
  }
  window.HEALTH_DAYS = days;

  /* ── chart drawing ── */
  const W = 330, PAD_L = 34, PAD_R = 4, PAD_T = 7, PAD_B = 5;
  const svgNS = 'http://www.w3.org/2000/svg';

  function el(name, attrs) {
    const node = document.createElementNS(svgNS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function xAt(k, n) {
    const inner = W - PAD_L - PAD_R;
    return PAD_L + (n <= 1 ? inner / 2 : (k / (n - 1)) * inner);
  }

  /* centred moving average; window shrinks at the edges so the line spans fully */
  function smooth(rows, get, win) {
    const half = Math.floor(win / 2);
    return rows.map((_, k) => {
      let sum = 0, count = 0;
      for (let j = Math.max(0, k - half); j <= Math.min(rows.length - 1, k + half); j++) {
        sum += get(rows[j]); count++;
      }
      return sum / count;
    });
  }

  function path(values, yScale, n) {
    return values.map((v, k) => (k ? 'L' : 'M') + xAt(k, n).toFixed(1) + ' ' + yScale(v).toFixed(1)).join(' ');
  }

  function panel(opts) {
    const { rows, height: H, min, max, ticks, smoothWin } = opts;
    const n = rows.length;
    const yScale = (v) => PAD_T + (1 - (v - min) / (max - min)) * (H - PAD_T - PAD_B);
    const svg = el('svg', { class: 'p-chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opts.label });

    /* reference marks sit under the data so they never hide a value */
    (opts.normal || []).forEach(([lo, hi]) => {
      svg.append(el('rect', {
        class: 'p-normal', x: PAD_L, width: W - PAD_L - PAD_R,
        y: yScale(hi).toFixed(1), height: Math.abs(yScale(lo) - yScale(hi)).toFixed(1)
      }));
    });

    (ticks || []).forEach(v => {
      svg.append(el('line', {
        class: 'p-grid-line', x1: PAD_L, x2: W - PAD_R,
        y1: yScale(v).toFixed(1), y2: yScale(v).toFixed(1)
      }));
      const label = el('text', { class: 'p-axis-text', x: PAD_L - 6, y: (yScale(v) + 4.5).toFixed(1), 'text-anchor': 'end' });
      label.textContent = v;
      svg.append(label);
    });

    if (opts.kind === 'bars') {
      const bw = Math.max(1.5, (W - PAD_L - PAD_R) / n - 0.9);
      rows.forEach((r, k) => {
        const y = yScale(opts.get(r));
        svg.append(el('rect', {
          class: 'p-bar', x: (xAt(k, n) - bw / 2).toFixed(1), y: y.toFixed(1),
          width: bw.toFixed(1), height: Math.max(1, yScale(min) - y).toFixed(1), rx: 0.8
        }));
      });
      return svg;
    }

    const win = smoothWin || 7;
    const mainRaw = rows.map(opts.get);
    const mainAvg = smooth(rows, opts.get, win);

    if (opts.get2) {
      const secondRaw = rows.map(opts.get2);
      const secondAvg = smooth(rows, opts.get2, win);
      const top = mainAvg.map((v, k) => (k ? 'L' : 'M') + xAt(k, n).toFixed(1) + ' ' + yScale(v).toFixed(1));
      const bottom = secondAvg.slice().reverse().map((v, k) => 'L' + xAt(n - 1 - k, n).toFixed(1) + ' ' + yScale(v).toFixed(1));
      svg.append(el('path', { class: 'p-band', d: top.join(' ') + ' ' + bottom.join(' ') + ' Z' }));
      svg.append(el('path', { class: 'p-daily', d: path(secondRaw, yScale, n) }));
      svg.append(el('path', { class: 'p-trend', d: path(secondAvg, yScale, n) }));
    }
    svg.append(el('path', { class: 'p-daily', d: path(mainRaw, yScale, n) }));
    svg.append(el('path', { class: 'p-trend', d: path(mainAvg, yScale, n) }));

    /* the normal band's fill sits under the green systolic–diastolic fill, so its
       edges are redrawn on top to stay visible */
    (opts.normal || []).forEach(([lo, hi]) => {
      [[hi, String(hi)], [lo, String(lo)]].forEach(([v, label]) => {
        svg.append(el('line', {
          class: 'p-target-line', x1: PAD_L, x2: W - PAD_R - 34,
          y1: yScale(v).toFixed(1), y2: yScale(v).toFixed(1)
        }));
        const t = el('text', { class: 'p-target-text', x: W - PAD_R - 30, y: (yScale(v) + 4).toFixed(1) });
        t.textContent = label;
        svg.append(t);
      });
    });

    (opts.targets || []).forEach(([v, label]) => {
      svg.append(el('line', {
        class: 'p-target-line', x1: PAD_L, x2: W - PAD_R - 34,
        y1: yScale(v).toFixed(1), y2: yScale(v).toFixed(1)
      }));
      const t = el('text', { class: 'p-target-text', x: W - PAD_R - 30, y: (yScale(v) + 4).toFixed(1) });
      t.textContent = label;
      svg.append(t);
    });
    return svg;
  }

  /* shared x axis: month labels plus one marker per day that carries a note */
  function axisStrip(rows) {
    const n = rows.length, H = 40;
    const svg = el('svg', { class: 'p-chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '기간과 특이사항을 적은 날' });
    rows.forEach((r, k) => {
      if (!r.note) return;
      svg.append(el('path', {
        class: 'p-marker',
        d: `M${xAt(k, n).toFixed(1)} 1 l4 7 h-8 Z`
      }));
    });
    svg.append(el('line', {
      class: 'p-grid-line', x1: PAD_L, x2: W - PAD_R, y1: 15, y2: 15
    }));
    let lastX = -99;
    rows.forEach((r, k) => {
      if (k !== 0 && r.date.getDate() !== 1) return;
      const x = xAt(k, n);
      if (x - lastX < 34) return;
      lastX = x;
      const t = el('text', { class: 'p-axis-text', x: x.toFixed(1), y: 32, 'text-anchor': k === 0 ? 'start' : 'middle' });
      t.textContent = (r.date.getMonth() + 1) + '월';
      svg.append(t);
    });
    return svg;
  }

  function block(name, last, svg) {
    const wrap = document.createElement('div');
    wrap.className = 'p-panel';
    wrap.setAttribute('data-component', 'new:TrendPanel');
    const head = document.createElement('div');
    head.className = 'p-panel-head';
    head.innerHTML = '<span class="p-panel-name">' + name + '</span>'
      + '<span class="p-panel-last">오늘 <b>' + last + '</b></span>';
    wrap.append(head, svg);
    return wrap;
  }

  function renderStack(host, rows, opts) {
    const o = opts || {};
    const win = o.smoothWin || 7;
    const show = o.only || ['bp', 'glucose', 'pulse', 'dose'];
    const h = o.compact ? 0.74 : 1;
    const today = rows[rows.length - 1];
    host.innerHTML = '';
    if (show.includes('bp')) host.append(block('혈압', today.sys + ' / ' + today.dia, panel({
      rows, height: Math.round(96 * h), min: 60, max: 160, ticks: [80, 120, 160],
      get: r => r.sys, get2: r => r.dia, smoothWin: win, label: '혈압 추이',
      normal: [[90, 130]]
    })));
    if (show.includes('glucose')) host.append(block('혈당', today.glucose, panel({
      rows, height: Math.round(86 * h), min: 90, max: 190, ticks: [140, 180],
      get: r => r.glucose, smoothWin: win, label: '혈당 추이',
      targets: [[100, '100']]
    })));
    if (show.includes('pulse')) host.append(block('맥박', today.pulse, panel({
      rows, height: 74, min: 50, max: 90, ticks: [60, 80],
      get: r => r.pulse, smoothWin: win, label: '맥박 추이'
    })));
    if (show.includes('dose')) host.append(block('인슐린', today.dose + ' 단위', panel({
      rows, height: 64, min: 0, max: 20, ticks: [10, 20], kind: 'bars',
      get: r => r.dose, label: '인슐린 투약 단위'
    })));
    if (o.axis) {
      const strip = document.createElement('div');
      strip.className = 'p-axis-strip';
      strip.append(axisStrip(rows));
      const key = document.createElement('p');
      key.className = 'p-axis-key';
      key.innerHTML =
        '<span><i class="band"></i> 혈압 정상 범위 90–130</span>'
        + '<span><i class="dash"></i> 혈당 정상 기준 100</span>'
        + '<span><svg width="13" height="11" viewBox="0 0 10 9" aria-hidden="true">'
        + '<path fill="var(--chart-5)" d="M5 0l4 7H1z"/></svg> 특이사항을 적은 날</span>';
      strip.append(key);
      host.append(strip);
    }
  }

  const fmt = (d) => (d.getMonth() + 1) + '월 ' + d.getDate() + '일';

  function init() {
    renderStack(document.getElementById('trend-charts'), days, { axis: true });
    document.getElementById('trend-range').textContent =
      fmt(days[0].date) + ' – ' + fmt(days[days.length - 1].date) + ' · ' + days.length + '일 기록';

    const recent = days.slice(-14);
    renderStack(document.getElementById('mini-charts'), recent, { smoothWin: 3, only: ['bp', 'glucose'], compact: true });
    document.getElementById('mini-range').textContent =
      fmt(recent[0].date) + ' – ' + fmt(recent[recent.length - 1].date);

    const noteHost = document.getElementById('trend-notes');
    noteHost.innerHTML = days.filter(d => d.note).slice(-5).reverse()
      .map(d => '<div><b>' + fmt(d.date) + '</b><p>' + d.note + '</p></div>').join('');

    document.getElementById('today-date').textContent = fmt(days[days.length - 1].date) + ' 목요일';

    show(location.hash.slice(1));
    addEventListener('hashchange', () => show(location.hash.slice(1)));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
